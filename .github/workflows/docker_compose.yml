name: Deploy ReiBot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reibot-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          provenance: false
          tags: hleitr/reibot:latest
      - uses: azure/login@v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sync runtime secrets
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES || '# Netscape HTTP Cookie File' }}
        run: |
          test -n "$DISCORD_TOKEN" && test -n "$YT_COOKIES"
          az containerapp secret set -g ReiBot -n reibot --secrets \
            "discord-token=$DISCORD_TOKEN" "youtube-cookies=$YT_COOKIES" \
            "bilibili-cookies=$BILIBILI_COOKIES"
      - name: Restart bot to pull latest
        run: |
          revision=$(az containerapp show -g ReiBot -n reibot --query properties.latestReadyRevisionName -o tsv)
          az containerapp revision restart -g ReiBot -n reibot --revision "$revision"
