name: Deploy ReiBot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reibot-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          provenance: false
          tags: hleitr/reibot:gh-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: azure/login@v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Sync runtime secrets
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES || '# Netscape HTTP Cookie File' }}
        run: |
          test -n "$DISCORD_TOKEN" && test -n "$YT_COOKIES"
          az containerapp secret set -g ReiBot -n reibot --secrets \
            "discord-token=$DISCORD_TOKEN" "youtube-cookies=$YT_COOKIES" \
            "bilibili-cookies=$BILIBILI_COOKIES"
      # Avoid two Discord workers during the update; always restart after it.
      - name: Stop bot
        id: stop
        uses: azure/powershell@v3
        with:
          azPSVersion: latest
          inlineScript: Stop-AzContainerApp -Name reibot -ResourceGroupName ReiBot | Out-Null
      - name: Deploy image
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: reibot
          resourceGroup: ReiBot
          location: westus
          imageToDeploy: registry.hub.docker.com/hleitr/reibot@${{ steps.image.outputs.digest }}
          environmentVariables: >-
            DISCORD_TOKEN=secretref:discord-token
            YT_COOKIES=secretref:youtube-cookies
            BILIBILI_COOKIES=secretref:bilibili-cookies
          disableTelemetry: true
      - name: Start bot
        if: always() && steps.stop.outcome != 'skipped'
        uses: azure/powershell@v3
        with:
          azPSVersion: latest
          inlineScript: Start-AzContainerApp -Name reibot -ResourceGroupName ReiBot | Out-Null
      - name: Check startup
        run: |
          app=$(az containerapp show -g ReiBot -n reibot --query id -o tsv)
          az resource wait --ids "$app" --api-version 2025-07-01 --timeout 300 --interval 5 \
            --custom "properties.runningStatus == 'Running' && properties.latestReadyRevisionName == properties.latestRevisionName"
